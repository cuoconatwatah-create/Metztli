name: Deploy Web Demo (GitHub Pages)

# Publica la versión web de Metztli en https://<usuario>.github.io/<repositorio>/
# Requiere activar una sola vez: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # La web se sirve desde una subruta (/Metztli): app.config.js la usa como baseUrl
      EXPO_BASE_URL: /${{ github.event.repository.name }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Verificar tipos (TypeScript)
        working-directory: ./frontend
        run: npm run ts:check

      - name: Exportar la web estática
        working-directory: ./frontend
        run: npx expo export --platform web --output-dir dist

      - name: Preparar para GitHub Pages
        working-directory: ./frontend
        run: |
          touch dist/.nojekyll      # Pages ignora carpetas con "_": sin esto no carga /_expo
          cp dist/index.html dist/404.html   # recarga de cualquier ruta vuelve a la app

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
