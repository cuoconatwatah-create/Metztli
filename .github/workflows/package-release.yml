name: Package Release (web + paquete Azure)

# Al crear una etiqueta v*, adjunta al Release dos archivos comprimidos:
#   · metztli-web-<versión>.zip     la web compilada (carpeta dist), lista para cualquier servidor estático
#   · metztli-azure-<versión>.zip   scripts de Azure, landing y panel, y las tablas de la base de datos
# El APK lo adjunta el workflow "Build Android APK".
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Verificar tipos (TypeScript)
        working-directory: ./frontend
        run: npm run ts:check

      - name: Compilar la web
        working-directory: ./frontend
        run: npx expo export --platform web --output-dir dist

      - name: Empaquetar
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          touch frontend/dist/.nojekyll
          (cd frontend/dist && zip -qr "../../metztli-web-${VERSION}.zip" .)
          zip -qr "metztli-azure-${VERSION}.zip" infra landing backend/supabase docs/AZURE_DESPLIEGUE.md scripts/check-supabase.mjs
          ls -lh metztli-*.zip

      - name: Guardar como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Metztli-paquetes
          path: metztli-*.zip

      - name: Adjuntar al Release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: metztli-*.zip
