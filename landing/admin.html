<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Metztli · Panel del equipo</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="index.html"><img src="logo.png" alt="" width="36" height="36"> METZTLI · PANEL</a>
      <nav class="nav"><a class="keep" href="index.html">Ver la página</a><a class="keep" id="logout" href="#" hidden>Cerrar sesión</a></nav>
    </div>
  </header>

  <main class="wrap panel">
    <!-- Acceso -->
    <section id="login-view" class="login" hidden>
      <h2>Acceso del equipo</h2>
      <p class="sub">Solo las cuentas con rol de <strong>Administrador</strong> pueden entrar.</p>
      <form id="login-form" class="demo" novalidate>
        <label>Correo electrónico <input type="email" name="email" autocomplete="username" required></label>
        <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
        <div id="login-msg" role="status" aria-live="polite"></div>
        <button class="btn" type="submit" id="login-submit">Entrar</button>
      </form>
    </section>

    <!-- Panel -->
    <section id="app-view" hidden>
      <div class="bar">
        <div><h2 style="margin:0">Panel del equipo</h2><p class="sub" id="who" style="margin:0"></p></div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-requests" aria-selected="true" data-tab="requests">Solicitudes de demo</button>
        <button class="tab" role="tab" id="tab-releases" aria-selected="false" data-tab="releases">Versiones de la app</button>
      </div>

      <div id="requests-pane">
        <div class="bar">
          <label style="display:flex;gap:8px;align-items:center">Estado
            <select id="status-filter"><option value="">Todas</option></select>
          </label>
          <span class="meta" id="requests-count"></span>
        </div>
        <div id="requests-list" class="list"></div>
      </div>

      <div id="releases-pane" hidden>
        <form id="release-form" class="demo" style="margin-top:8px" novalidate>
          <h3>Publicar una versión</h3>
          <label>Plataforma <select name="platform" id="rel-platform"></select></label>
          <label>Versión <input type="text" name="version" placeholder="2.0.8" maxlength="30" required></label>
          <label>Archivo instalable <span class="hint">(se guarda en este servidor)</span> <input type="file" name="file" id="rel-file"></label>
          <label>…o enlace de descarga <span class="hint">(por ejemplo, un Release de GitHub)</span> <input type="text" name="download_url" placeholder="https://github.com/…/Metztli-2.0.8.apk" maxlength="500"></label>
          <label>Notas de la versión <span class="hint">(opcional)</span> <textarea name="notes" maxlength="1000"></textarea></label>
          <label class="check"><input type="checkbox" name="make_current" checked> <span>Marcar como la versión actual (la que descarga la landing)</span></label>
          <div id="release-msg" role="status" aria-live="polite"></div>
          <button class="btn" type="submit" id="release-submit">Publicar</button>
        </form>
        <h3 style="margin-top:28px">Versiones publicadas</h3>
        <div id="releases-list" class="list"></div>
      </div>
    </section>

    <div id="boot-msg" class="msg info" hidden></div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
